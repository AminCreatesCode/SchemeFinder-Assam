<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12344d" />
  <meta name="description" content="SchemeFinder Assam helps residents discover potentially relevant government schemes." />
  <title>SchemeFinder Assam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Public+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="topbar" id="topbar">
    <div class="shell nav">
      <a class="brand" href="#/" aria-label="SchemeFinder Assam home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </span>
        <span><strong>SchemeFinder</strong><small>Assam</small></span>
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#/">Home</a>
        <a href="#/schemes">Explore Schemes</a>
        <a href="#/how-it-works">How It Works</a>
        <a href="#/about">About</a>
        <label class="language-selector"><span class="sr-only">Language</span><select id="language-select" aria-label="Language"><option>English</option><option>অসমীয়া</option><option>हिंदी</option></select></label>
        <button class="icon-button saved-nav" id="saved-nav" type="button" aria-label="View saved schemes">
          <span>Sign In</span>
          <span class="saved-count" id="saved-count">0</span>
        </button>
        <a class="nav-primary" href="#/find">Find Schemes for Me <span aria-hidden="true">→</span></a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to night mode" title="Night mode">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.6 8.6 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      </button>
      <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-expanded="false" aria-controls="mobile-menu">Menu</button>
    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation">
      <a href="#/">Home</a><a href="#/schemes">Explore Schemes</a><a href="#/how-it-works">How It Works</a><a href="#/about">About</a><a href="#/saved">User Dashboard</a><a class="nav-primary" href="#/find">Find Schemes for Me</a>
    </nav>
  </header>
  <main id="main-content" tabindex="-1"></main>
  <button class="assistant-fab" id="assistant-fab" type="button" aria-label="Open free scheme assistant">
    <span class="assistant-fab-icon" aria-hidden="true">✦</span>
    <span class="assistant-fab-label">Ask AI</span>
  </button>
  <aside class="assistant-panel" id="assistant-panel" aria-label="Scheme assistant" aria-hidden="true">
    <div class="assistant-head">
      <div><span class="assistant-kicker">Free demo assistant</span><h2>Scheme assistant</h2></div>
      <button class="icon-button" id="assistant-close" type="button" aria-label="Close assistant">×</button>
    </div>
    <div class="assistant-disclaimer">Browser-only demo: no API key or account needed. It does not decide eligibility.</div>
    <div class="chat-prompts" aria-label="Suggested questions">
      <button type="button" data-question="Which schemes are available for students?">Student schemes</button>
      <button type="button" data-question="What documents do I need?">Required documents</button>
      <button type="button" data-question="Why might I match?">Explain eligibility</button>
    </div>
    <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <label class="sr-only" for="chat-input">Ask a question</label>
      <input id="chat-input" autocomplete="off" placeholder="Ask about a scheme…" />
      <button type="submit" aria-label="Send message">→</button>
    </form>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
